description = "Local Enron email embedding generation and pgvector loading tools."
requires-python = ">=3.12"
dependencies = [
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.6",
    "sentence-transformers>=3.4.1",
    "torch>=2.7.0",
    "tqdm>=4.67.1",
]

[tool.uv]
package = false

